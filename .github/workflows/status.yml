name: Monitorar sites e publicar painel

on:
  # As checagens regulares continuam sendo disparadas pela Cloudflare.
  schedule:
    - cron: '0 0 * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sites.json
      - monitor/**
      - web/**
      - .github/workflows/status.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'status-pages' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s monitor

  monitor:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Testar monitor
        run: python3 -m unittest discover -s monitor
      - name: Checar sites e atualizar a dist
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 monitor/run.py --live
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .build/public

  deploy:
    needs: monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: pages
        uses: actions/deploy-pages@v5
